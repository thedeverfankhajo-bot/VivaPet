name: VivaPet
main: VivaPet\Main
version: 2.0.0
api: 5.0.0
src-namespace-prefix: "VivaPet"
author: VivaPet Team
description: Rank-locked companion pets using vanilla Bedrock models; no resource pack required.
prefix: VivaPet

commands:
  pet:
    description: Manage your VivaPet companion.
    usage: "/pet [help|list [page]|summon <pet>|random|hide|show|toggle|active|remove|info <pet>|reload]"
    aliases: [pets]
    permission: vivapet.command

permissions:
  vivapet.command:
    description: Allows using the /pet command.
    default: op
  vivapet.admin:
    description: Allows reloading VivaPet configuration.
    default: op
  vivapet.pet.all:
    description: Unlocks every VivaPet companion.
    default: false
